name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "${{ matrix.python }}"
      - name: Complete repository gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repo.py
          git diff --check
          git diff --exit-code
      - name: Publish test coverage summary
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'coverage>=7,<8'
          mkdir -p build
          python -m coverage run --source=scripts -m unittest discover -s tests -p 'test_*.py'
          python -m coverage report | tee build/coverage-report.txt
          python -m coverage xml -o build/coverage.xml
          {
            echo "### Test coverage (scripts/)"
            echo ""
            echo '```'
            tail -n 30 build/coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: always() && runner.os == 'Linux' && matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pax-coverage-py3.12
          path: |
            build/coverage-report.txt
            build/coverage.xml
          if-no-files-found: ignore
          retention-days: 14
  required:
    name: CI required
    if: always()
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete CI matrix
        run: |
          test "${{ needs.gate.result }}" = "success"
