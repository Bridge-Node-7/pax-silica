name: Browser UAT

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-uat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install Python dependency
        run: python -m pip install -r requirements-browser.txt

      - name: Build
        run: python scripts/build_web.py --output build/web

      - name: Serve and test
        shell: bash
        run: |
          set -euo pipefail

          python scripts/serve_preview.py             --directory build/web             --port 8765             >build/http.log 2>&1 &

          pid=$!

          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -fsS               http://127.0.0.1:8765/               >/dev/null               && break

            sleep 1
          done

          python scripts/browser_uat.py             --base-url http://127.0.0.1:8765/             --evidence build/browser-uat

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pax-silica-browser-uat-chromium
          path: |
            build/browser-uat/
            build/http.log
          if-no-files-found: error
          retention-days: 14

  cross-browser:
    strategy:
      fail-fast: false
      matrix:
        browser:
          - firefox
          - webkit

    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install Python dependency
        run: python -m pip install -r requirements-browser.txt

      - name: Build
        run: python scripts/build_web.py --output build/web

      - name: Serve and smoke test
        shell: bash
        run: |
          set -euo pipefail

          python scripts/serve_preview.py             --directory build/web             --port 8765             >build/http.log 2>&1 &

          pid=$!

          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -fsS               http://127.0.0.1:8765/               >/dev/null               && break

            sleep 1
          done

          python scripts/browser_smoke.py             --browser "${{ matrix.browser }}"             --base-url http://127.0.0.1:8765/             --evidence "build/browser-${{ matrix.browser }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pax-silica-browser-uat-${{ matrix.browser }}
          path: |
            build/browser-${{ matrix.browser }}/
            build/http.log
          if-no-files-found: error
          retention-days: 14

  required:
    name: Browser UAT required
    if: always()
    needs:
      - chromium
      - cross-browser
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require complete Browser UAT
        run: |
          test "${{ needs.chromium.result }}" = "success"
          test "${{ needs.cross-browser.result }}" = "success"
