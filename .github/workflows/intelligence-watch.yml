name: Intelligence Watch
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: pax-silica-intelligence-watch
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Check freshness and known source health
        run: |
          mkdir -p build/intelligence-watch
          python scripts/intelligence_watch.py --warn-days 2 --check-urls --json-output build/intelligence-watch/report.json --markdown-output build/intelligence-watch/report.md
      - name: Open or update review issue when action is needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report=json.loads(Path("build/intelligence-watch/report.json").read_text())
          if not report["needs_review"]:
              print("No intelligence review required.")
              raise SystemExit(0)
          title="Pax Silica intelligence watch"
          body=Path("build/intelligence-watch/report.md").read_text()
          q=subprocess.run(["gh","issue","list","--state","open","--search",f'{title} in:title',"--json","number,title"],capture_output=True,text=True,check=True)
          issues=json.loads(q.stdout)
          match=next((i for i in issues if i["title"]==title),None)
          if match:
              subprocess.run(["gh","issue","edit",str(match["number"]),"--body",body],check=True)
          else:
              subprocess.run(["gh","issue","create","--title",title,"--body",body],check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pax-silica-intelligence-watch
          path: build/intelligence-watch/
          if-no-files-found: error
          retention-days: 14
